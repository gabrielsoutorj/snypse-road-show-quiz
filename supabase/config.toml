project_id = "snypse-road-show-quiz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://gabrielsoutorj.github.io/snypse-road-show-quiz/"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Eventos podem concentrar 100 celulares atrás do mesmo IP/NAT.
# Replicar este valor em Authentication > Rate Limits no projeto hospedado.
anonymous_users = 200

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.quiz-api]
enabled = true
verify_jwt = true
